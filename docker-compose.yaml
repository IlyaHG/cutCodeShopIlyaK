services:
  nginx:
    image: "nginx:stable-alpine"
    ports:
      - 80:80
    volumes:
      - './docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
      - './:/var/www/app_cut'
    depends_on:
      - mysql_ilya
      - php_ilya

  php_ilya:
    container_name: php_ilya
    build:
      dockerfile: docker/php/Dockerfile
    volumes:
      - './:/var/www/app_cut'
    ports:
      - 8080:9000
      - 5174:5174

  mysql_ilya:
    container_name: mysql_ilya
    image: mysql:8.0
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - db_data:/var/lib/mysql

  redis:
    restart: unless-stopped
    image: 'redis:alpine'
    container_name: redis_php_ilya
    environment:
      REDIS_HOST: '${REDIS_HOST:-redis_php_ilya}'
      REDIS_DATABASES: 1
      REDIS_PORT: '${REDIS_PORT:-6379}'
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'redis_php_ilya:/data'
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      retries: 3
      timeout: 5s


